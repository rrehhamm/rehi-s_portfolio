name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows triggering this workflow manually from the Actions tab.
  workflow_dispatch:

# Grant the minimum GITHUB_TOKEN permissions needed to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment, but do not cancel an in-progress run
# so a deploy is never left half-finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
